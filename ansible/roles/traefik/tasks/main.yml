---
- name: Create Traefik directory
  ansible.builtin.file:
    path: "{{ app_dir }}/traefik"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Ensure acme.json exists with strict permissions (0600)
  ansible.builtin.file:
    path: "{{ app_dir }}/traefik/acme.json"
    state: touch
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    modification_time: preserve
    access_time: preserve
