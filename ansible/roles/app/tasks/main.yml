---
- name: Copy docker-compose.yml to /opt/myapp
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Deploy .env file with Neon PostgreSQL credentials
  ansible.builtin.copy:
    dest: "{{ app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    content: |
      DOCKERHUB_USERNAME=abdoulayely777
      APP_TAG=latest
      SPRING_DATASOURCE_URL=jdbc:postgresql://ep-twilight-frost-b5wgpznz-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
      SPRING_DATASOURCE_USERNAME=neondb_owner
      SPRING_DATASOURCE_PASSWORD=npg_4HBwLetzRDh5
      GRAFANA_ADMIN_PASSWORD=AdminDevOps2026!

- name: Pull and start infrastructure services (Traefik, Prometheus, Grafana, Node Exporter, cAdvisor, SonarQube)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services:
      - traefik
      - prometheus
      - grafana
      - node-exporter
      - cadvisor
      - sonarqube
    state: present
