---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - htop
      - ufw
      - python3-pip
      - python3-docker
      - net-tools
    state: present

- name: Configure sysctl vm.max_map_count for SonarQube and Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: yes

- name: Configure sysctl fs.file-max
  ansible.posix.sysctl:
    name: fs.file-max
    value: "65536"
    state: present
    reload: yes

- name: Configure security limits for SonarQube
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-sonarqube.conf
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 4096
      * hard nproc 4096
    mode: '0644'

- name: Check if swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create swap file if not present
  ansible.builtin.command: fallocate -l {{ swap_size_gb }}G /swapfile
  when: not swapfile_stat.stat.exists

- name: Set permissions on swapfile
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when: not swapfile_stat.stat.exists

- name: Format swapfile
  ansible.builtin.command: mkswap /swapfile
  when: not swapfile_stat.stat.exists

- name: Enable swap
  ansible.builtin.command: swapon /swapfile
  when: not swapfile_stat.stat.exists

- name: Add swapfile to /etc/fstab
  ansible.posix.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Configure vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: yes

- name: Create base application directory /opt/myapp
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
