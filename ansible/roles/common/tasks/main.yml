- name: Créer le répertoire de base de l'application /opt/myapp
  ansible.builtin.file:
    path: "{{ app_dir }}" # /opt/myapp (définie dans les group_vars)
    state: directory # S'assure que c'est un dossier et pas un fichier
    owner: ubuntu # Le propriétaire du dossier sera notre utilisateur 'ubuntu'
    group: ubuntu
    mode: '0755' # Propriétaire: lire/écrire/exécuter. Autres: lire/exécuter.
