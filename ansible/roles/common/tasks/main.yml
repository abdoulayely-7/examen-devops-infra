---
- name: Mettre à jour le cache apt
  ansible.builtin.apt:
    update_cache: yes # Demande à Ubuntu de rafraîchir la liste de ses paquets
    cache_valid_time: 3600 # Ne rafraîchit pas si on l'a déjà fait dans la dernière heure (3600s)

- name: Installer les paquets système essentiels
  ansible.builtin.apt:
    name:
      - ca-certificates # Certificats de sécurité pour les connexions HTTPS
      - curl # Outil pour télécharger des fichiers en ligne de commande
      - gnupg # Outil de cryptographie (souvent utilisé pour vérifier les signatures de paquets)
      - git # Outil de gestion de versions
      - htop # Moniteur système interactif (plus beau que 'top')
      - ufw # Pare-feu interne de Linux (Uncomplicated Firewall)
      - python3-pip # Gestionnaire de paquets pour Python
      - python3-docker # Librairie Python nécessaire pour qu'Ansible contrôle Docker
      - net-tools # Outils réseaux (comme ifconfig ou netstat)
    state: present # Indique qu'on veut s'assurer que ces paquets sont installés

- name: Configurer sysctl vm.max_map_count pour SonarQube et Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144" # Augmente la limite des zones mémoires, indispensable pour Elasticsearch (sinon SonarQube crashe)
    state: present
    reload: yes # Recharge la configuration immédiatement sans redémarrer le serveur

- name: Configurer sysctl fs.file-max # nombre maximum de descripteurs de fichiers que le noyau peut allouer
  ansible.posix.sysctl:
    name: fs.file-max
    value: "65536" # Augmente le nombre maximum de fichiers qu'un processus peut ouvrir simultanément
    state: present
    reload: yes

- name: Configurer les limites de sécurité pour SonarQube
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-sonarqube.conf # Crée un fichier de configuration pour les limites utilisateurs
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 4096
      * hard nproc 4096
    mode: '0644' # Définit les droits du fichier (lecture/écriture pour root, lecture pour les autres)

